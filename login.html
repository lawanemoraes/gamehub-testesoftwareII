<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-animado"></div>

  <div class="container">
    <div class="card">
      <div class="logo">
        <span class="icon">🎮</span>
        <h1>GameHub</h1>
        <p class="subtitle">Entre na sua conta</p>
      </div>

      <form id="formLogin" onsubmit="event.preventDefault(); login();">
        <div class="input-group">
          <label>📧 Email</label>
          <input type="email" id="loginEmail" placeholder="gamer@email.com">
        </div>

        <div class="input-group">
          <label>🔒 Senha</label>
          <input type="password" id="loginSenha" placeholder="Digite sua senha">
        </div>

        <button type="submit">Entrar 🎯</button>
        <p id="mensagem"></p>

        <p class="link-login">
          Novo por aqui? <a href="index.html">Criar Conta</a>
        </p>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
