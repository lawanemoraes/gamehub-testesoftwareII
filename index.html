<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub - Criar Conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-animado"></div>

  <div class="container">
    <div class="card">
      <div class="logo">
        <span class="icon">🎮</span>
        <h1>GameHub</h1>
        <p class="subtitle">Crie sua conta de gamer</p>
      </div>

      <form id="formCadastro" onsubmit="event.preventDefault(); cadastrar();">
        <div class="input-group">
          <label>👤 Nickname</label>
          <input type="text" id="nickname" placeholder="Ex: ProPlayer123">
        </div>

        <div class="input-group">
          <label>📧 Email</label>
          <input type="email" id="email" placeholder="gamer@email.com">
        </div>

        <div class="input-group">
          <label>🎂 Data de Nascimento</label>
          <input type="date" id="dataNasc">
        </div>

        <div class="input-group">
          <label>🎯 Jogo Favorito</label>
          <select id="jogoFav">
            <option value="">-- Selecione --</option>
            <option value="FPS">FPS (CS, Valorant, COD)</option>
            <option value="MOBA">MOBA (LOL, Dota)</option>
            <option value="RPG">RPG (Elden Ring, Skyrim)</option>
            <option value="Battle Royale">Battle Royale (Fortnite, PUBG)</option>
            <option value="Indie">Indie (Hollow Knight, Celeste)</option>
          </select>
        </div>

        <div class="input-group">
          <label>🔒 Senha</label>
          <input type="password" id="senha" placeholder="Mínimo 6 caracteres com 1 número">
        </div>

        <div class="input-group">
          <label>🔒 Confirmar Senha</label>
          <input type="password" id="confirmar" placeholder="Repita a senha">
        </div>

        <button type="submit">Criar Conta 🚀</button>
        <p id="mensagem"></p>

        <p class="link-login">
          Já é um gamer? <a href="login.html">Fazer Login</a>
        </p>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
